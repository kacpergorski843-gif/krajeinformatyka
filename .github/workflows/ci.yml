name: CI

on:
  push:
    branches: ["main", "audit-fixes-2026-09"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test:format
      - run: bun run lint
      - run: bun run build
        if: always()
      - run: bun run typecheck
        if: always()
