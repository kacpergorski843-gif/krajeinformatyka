name: Validate and deploy Supabase migrations

on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-migrations.yml"
      - "scripts/validate-supabase-migrations.py"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-migrations.yml"
      - "scripts/validate-supabase-migrations.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate migration files
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python3 scripts/validate-supabase-migrations.py

  deploy:
    name: Deploy production database migrations
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check deployment secrets
        id: credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "::warning::Database deployment skipped. Add the SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD repository secrets to enable it."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Set up Supabase CLI
        if: steps.credentials.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        if: steps.credentials.outputs.ready == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase link --project-ref kbcofzdboyzgsquvtzfq --password "$SUPABASE_DB_PASSWORD"

      - name: Show remote migration state
        if: steps.credentials.outputs.ready == 'true'
        run: supabase migration list --linked

      - name: Preview pending migrations
        if: steps.credentials.outputs.ready == 'true'
        run: supabase db push --linked --dry-run

      - name: Apply migrations to production
        if: steps.credentials.outputs.ready == 'true' && vars.SUPABASE_MIGRATIONS_AUTODEPLOY == 'true'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --linked --yes

      - name: Explain deployment is awaiting explicit enablement
        if: steps.credentials.outputs.ready == 'true' && vars.SUPABASE_MIGRATIONS_AUTODEPLOY != 'true'
        run: |
          echo "::notice::Dry-run completed. Automatic production deployment remains disabled."
          echo "After verifying the remote migration history is aligned with the repository, set the repository Actions variable SUPABASE_MIGRATIONS_AUTODEPLOY to true."
